experiment_name: "maskrcnn_resnet50_fpn_v2"
model: "maskrcnn_resnet50_fpn_v2"
num_classes: 2

dataset:
  train: "../../../BubANN_GAN.v1i.coco-segmentation/train"
  val: "../../../BubANN_GAN.v1i.coco-segmentation/valid"
  test: "../../../BubANN_GAN.v1i.coco-segmentation/test"

train:
  batch_size: 2
  epochs: 20              # increased to see LR schedule
  lr: 0.005
  lr_step_size: 3         # every 3 epochs
  gamma: 0.1              # decay factor
  momentum: 0.9
  weight_decay: 0.0005
  num_workers: 4
  print_freq: 20          # optional: log every N steps

logging:
  use_tensorboard: true
  log_dir: "runs/maskrcnn_resnet50_fpn_v2"

output_dir: "outputs/maskrcnn_resnet50_fpn_v2/"
