experiment_name: "unet"
model: "unet"
num_classes: 2

dataset:
  train: "../../../BubANN_GAN.v1i.coco-segmentation/train"
  val: "../../../BubANN_GAN.v1i.coco-segmentation/valid"
  test: "../../../BubANN_GAN.v1i.coco-segmentation/test"

train:
  batch_size: 2
  epochs: 20
  lr: 0.001
  lr_step_size: 5
  gamma: 0.5
  momentum: 0.9
  weight_decay: 0.0005
  num_workers: 2
  print_freq: 20


logging:
  use_tensorboard: true
  log_dir: "runs/unet"

output_dir: "outputs/unet/"
