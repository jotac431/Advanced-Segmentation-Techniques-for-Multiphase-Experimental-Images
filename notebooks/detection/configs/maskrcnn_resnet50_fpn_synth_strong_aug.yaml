experiment:
  name: "maskrcnn_r50_fpn_synth_strong_aug"

model:
  type: "maskrcnn_resnet50_fpn"
  num_classes: 2
  pretrained_backbone: true

dataset:
  train: "../../../BubANN_GAN.v1i.coco-segmentation/train"
  val:   "../../../BubANN_GAN.v1i.coco-segmentation/valid"
  test:  "../../../BubANN_GAN.v1i.coco-segmentation/test"

train:
  batch_size: 2
  epochs: 20
  lr: 0.001
  backbone_lr_factor: 0.1
  lr_step_size: 5
  gamma: 0.1
  momentum: 0.9
  weight_decay: 0.0005
  num_workers: 4
  print_freq: 20

augmentation:
  strong_color_jitter: true
  blur: true
  rotation: false       # KEEP false – rotation is unsafe for detection
  intensity_shift: true

logging:
  use_tensorboard: true
  log_dir: "runs/"

output:
  dir: "outputs/"

eval:
  score_thresh: 0.5  
  min_area: 50         
  mask_thresh: 0.5  
