# General experiment info
experiment:
  name: "maskrcnn_resnet50_fpn"
  seed: 42

# Model definition
model:
  type: "maskrcnn_resnet50_fpn"
  num_classes: 2
  pretrained_backbone: true

# Dataset paths
dataset:
  train: "../../../BubANN_GAN.v1i.coco-segmentation/train"
  val:   "../../../BubANN_GAN.v1i.coco-segmentation/valid"
  test:  "../../../BubANN_GAN.v1i.coco-segmentation/test"

# Training hyperparameters
train:
  batch_size: 2
  epochs: 20
  lr: 0.001             # main LR for heads
  backbone_lr_factor: 0.1   # LR_backbone = lr * factor
  lr_step_size: 5
  gamma: 0.1
  momentum: 0.9
  weight_decay: 0.0005
  num_workers: 4
  print_freq: 20

# Augmentation options
augmentation:
  strong_color_jitter: false
  blur: false
  rotation: false       # Rotation disabled for detection stability
  intensity_shift: false

# Logging
logging:
  use_tensorboard: true
  log_dir: "runs/"

# Output
output:
  dir: "outputs/"

eval:
  score_thresh: 0.5      # min score to keep a prediction
  min_area: 50           # min mask area (in pixels) to keep
  mask_thresh: 0.5       # threshold on predicted mask probabilities

