experiment_name: "maskrcnn_resnet50_fpn_stable"
model: "maskrcnn_resnet50_fpn"
num_classes: 2

dataset:
  train: "../../../BubANN_GAN.v1i.coco-segmentation/train"
  val:   "../../../BubANN_GAN.v1i.coco-segmentation/valid"
  test:  "../../../BubANN_GAN.v1i.coco-segmentation/test"

train:
  batch_size: 2
  epochs: 20              # you can still keep 20, early stopping will likely stop earlier
  lr: 0.001               # <–– LOWER: safer for full-network training
  lr_step_size: 5         # step every 5 epochs
  gamma: 0.1              # decay factor
  momentum: 0.9
  weight_decay: 0.0005
  num_workers: 4
  print_freq: 20

logging:
  use_tensorboard: true
  log_dir: "runs/maskrcnn_resnet50_fpn_stable"

output_dir: "outputs/maskrcnn_resnet50_fpn_stable/"
